name: PySpark CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          pip install -r requirements.txt
          python -m pytest -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package job
        run: zip job_archive.zip pyspark_job.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyspark-job-${{ github.sha }}
          path: job_archive.zip
